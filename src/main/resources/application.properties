server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
bank.base-url=${BANK_BASE_URL:http://localhost:8080}
bank.connect-timeout=${BANK_CONNECT_TIMEOUT:2s}
bank.read-timeout=${BANK_READ_TIMEOUT:5s}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level request_id=%X{request_id:-none} logger=%logger{36} message=%msg%n
