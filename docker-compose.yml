services:
  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

  gateway:
    build: .
    ports:
      - "8090:8090"
    environment:
      BANK_BASE_URL: http://bank_simulator:8080
      BANK_CONNECT_TIMEOUT: 2s
      BANK_READ_TIMEOUT: 5s
    depends_on:
      - bank_simulator
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8090/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
